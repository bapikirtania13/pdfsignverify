name: pdf_sign_verify
description: "PDF Sign Verify - Real cryptographic PDF digital signature verification"
publish_to: 'none'
version: 1.0.3+3

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^9.0.0
  path_provider: ^2.1.0
  share_plus: ^10.0.0
  crypto: ^3.0.3
  intl: ^0.20.0
  google_fonts: ^6.2.0
  flutter_pdfview: ^1.3.2
  permission_handler: ^11.0.0
  url_launcher: ^6.2.0
  animate_do: ^3.3.3
  google_mobile_ads: ^9.1.0
  firebase_core: ^4.15.0
  firebase_analytics: ^12.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/
    - assets/certs/
    - assets/images/
